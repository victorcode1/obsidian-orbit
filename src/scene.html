<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsidian Orbit scene</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #060809;
      }

      .grid,
      .sphere,
      .network {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .grid {
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(103, 232, 249, 0.04),
          transparent 60%
        );
      }

      .sphere {
        filter: brightness(1.12) contrast(1.08) sepia(0.3) hue-rotate(135deg)
          saturate(1.35);
        opacity: 0;
        transition: opacity 600ms ease-out;
      }

      .sphere.ready {
        opacity: 0.72;
      }

      .network {
        opacity: 0.42;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <canvas class="sphere" id="sphere"></canvas>
    <canvas class="network" id="network"></canvas>

    <script type="module">
      // The sandboxed page has no storage, and Spline reads it on load. Keep it in memory.
      const memoryStorage = () => {
        const items = new Map();
        return {
          get length() {
            return items.size;
          },
          key: (index) => [...items.keys()][index] ?? null,
          getItem: (key) => items.get(String(key)) ?? null,
          setItem: (key, value) => items.set(String(key), String(value)),
          removeItem: (key) => items.delete(String(key)),
          clear: () => items.clear(),
        };
      };
      for (const name of ["localStorage", "sessionStorage"]) {
        Object.defineProperty(window, name, {
          value: memoryStorage(),
          configurable: true,
        });
      }

      // T3 Code forwards the app's pointer, since this sandboxed page sits behind it.
      window.addEventListener("message", ({ data }) => {
        if (data?.type === "t3-theme-scene:pointer") {
          document.dispatchEvent(
            new PointerEvent("pointermove", {
              bubbles: true,
              clientX: data.x,
              clientY: data.y,
            }),
          );
        } else if (data?.type === "t3-theme-scene:pointer-leave") {
          window.dispatchEvent(new Event("pointerleave"));
        }
      });

      const motion = window.matchMedia("(prefers-reduced-motion: reduce)");

      async function startSphere() {
        const canvas = document.getElementById("sphere");
        try {
          const { Application } =
            await import("https://cdn.jsdelivr.net/npm/@splinetool/runtime@1.12.97/build/runtime.js");
          const app = new Application(canvas);
          await app.load(
            "https://prod.spline.design/V5FeUBR8GDPKXxRA/scene.splinecode",
          );
          app.setGlobalEvents(true);
          canvas.classList.add("ready");
        } catch (error) {
          // Offline or blocked: the grid and the network still render.
          console.warn("Spline scene unavailable", error);
        }
      }

      // Particle network that drifts and leans toward the pointer.
      function startNetwork() {
        const PARTICLE_COUNT = 92;
        const CONNECTION_DISTANCE = 220;
        const POINTER_RADIUS = 148;
        const DEPTH = 170;
        const PERSPECTIVE = 760;

        const canvas = document.getElementById("network");
        const context = canvas.getContext("2d");
        let width = 0;
        let height = 0;
        let particles = [];
        let rotationX = 0;
        let rotationY = 0;
        let frame = 0;
        const pointer = { x: 0, y: 0, active: false };

        const createParticles = () =>
          Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            z: (Math.random() - 0.5) * DEPTH,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
            size: 1 + Math.random() * 1.8,
          }));

        const resize = () => {
          width = Math.max(window.innerWidth, 1);
          height = Math.max(window.innerHeight, 1);
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          particles = createParticles();
          if (motion.matches) draw();
        };

        const project = (particle) => {
          const centerX = width / 2;
          const centerY = height / 2;
          const x = particle.x - centerX;
          const y = particle.y - centerY;
          const cosY = Math.cos(rotationY);
          const sinY = Math.sin(rotationY);
          const cosX = Math.cos(rotationX);
          const sinX = Math.sin(rotationX);
          const rotatedX = x * cosY + particle.z * sinY;
          const rotatedZ = -x * sinY + particle.z * cosY;
          const rotatedY = y * cosX - rotatedZ * sinX;
          const depth = y * sinX + rotatedZ * cosX;
          const perspective = PERSPECTIVE / (PERSPECTIVE + depth);
          return {
            ...particle,
            screenX: centerX + rotatedX * perspective,
            screenY: centerY + rotatedY * perspective,
            screenSize: particle.size * (0.88 + perspective * 0.16),
          };
        };

        const drawParticle = (particle, highlight) => {
          context.beginPath();
          context.arc(
            particle.screenX,
            particle.screenY,
            particle.screenSize + highlight * 1.4,
            0,
            Math.PI * 2,
          );
          context.fillStyle = `rgba(103, 232, 249, ${0.5 + highlight * 0.28})`;
          context.fill();
          context.beginPath();
          context.arc(
            particle.screenX,
            particle.screenY,
            Math.max(0.8, particle.screenSize * 0.52),
            0,
            Math.PI * 2,
          );
          context.fillStyle = `rgba(225, 250, 255, ${0.6 + highlight * 0.18})`;
          context.fill();
        };

        const draw = () => {
          context.clearRect(0, 0, width, height);
          const targetX = pointer.active
            ? -(pointer.y / height - 0.5) * 0.32
            : 0;
          const targetY = pointer.active ? (pointer.x / width - 0.5) * 0.46 : 0;
          rotationX += (targetX - rotationX) * 0.055;
          rotationY += (targetY - rotationY) * 0.055;

          for (const particle of particles) {
            if (!motion.matches) {
              particle.x += particle.vx;
              particle.y += particle.vy;
            }
            if (particle.x <= -8) particle.x = width + 8;
            if (particle.x >= width + 8) particle.x = -8;
            if (particle.y <= -8) particle.y = height + 8;
            if (particle.y >= height + 8) particle.y = -8;
            if (pointer.active) {
              const dx = pointer.x - particle.x;
              const dy = pointer.y - particle.y;
              const distance = Math.hypot(dx, dy);
              if (distance < POINTER_RADIUS && distance > 0) {
                const pull = (1 - distance / POINTER_RADIUS) * 0.018;
                particle.x += dx * pull;
                particle.y += dy * pull;
              }
            }
          }

          const projected = particles.map(project);
          context.lineWidth = 0.75;
          for (let i = 0; i < projected.length; i += 1) {
            for (let j = i + 1; j < projected.length; j += 1) {
              const first = projected[i];
              const second = projected[j];
              const distance = Math.hypot(
                first.x - second.x,
                first.y - second.y,
              );
              if (distance > CONNECTION_DISTANCE) continue;
              const alpha = 0.04 + (1 - distance / CONNECTION_DISTANCE) * 0.18;
              context.beginPath();
              context.moveTo(first.screenX, first.screenY);
              context.lineTo(second.screenX, second.screenY);
              context.strokeStyle = `rgba(94, 166, 190, ${alpha})`;
              context.stroke();
            }
          }

          for (const particle of projected) {
            let highlight = 0;
            if (pointer.active) {
              const distance = Math.hypot(
                pointer.x - particle.screenX,
                pointer.y - particle.screenY,
              );
              if (distance < POINTER_RADIUS)
                highlight = 1 - distance / POINTER_RADIUS;
            }
            drawParticle(particle, highlight);
          }

          if (!motion.matches) frame = requestAnimationFrame(draw);
        };

        document.addEventListener("pointermove", (event) => {
          if (motion.matches) return;
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
        });
        window.addEventListener("pointerleave", () => {
          pointer.active = false;
        });
        motion.addEventListener("change", () => {
          pointer.active = false;
          cancelAnimationFrame(frame);
          draw();
        });
        window.addEventListener("resize", resize);
        resize();
        if (!motion.matches) draw();
      }

      startNetwork();
      startSphere();
    </script>
  </body>
</html>
